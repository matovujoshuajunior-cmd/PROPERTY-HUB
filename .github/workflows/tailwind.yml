name: Build Tailwind CSS

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'guides/**/*.html'
      - 'tailwind.config.js'
      - 'input.css'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Tailwind
        run: npm install

      - name: Build CSS
        run: npx tailwindcss -i ./input.css -o ./styles.css --minify

      - name: Commit styles.css
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-build Tailwind CSS [skip ci]"
          git push
