name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'   # rebuild every 6 hours so DB changes propagate

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Supabase SDK
        run: npm install @supabase/supabase-js

      - name: Verify secrets
        env:
          SUPA_URL: ${{ secrets.SUPABASE_URL }}
          SUPA_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPA_URL" ]; then
            echo "❌ FATAL: SUPABASE_URL secret missing"
            echo "Add at: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          if [ -z "$SUPA_KEY" ]; then
            echo "❌ FATAL: SUPABASE_ANON_KEY secret missing"
            exit 1
          fi
          echo "✅ Secrets present (URL: ${SUPA_URL:0:40}..., key: ${#SUPA_KEY} chars)"

      - name: Verify script exists
        run: |
          if [ ! -f "scripts/prerender.mjs" ]; then
            echo "❌ FATAL: scripts/prerender.mjs not found"
            echo "Available files in scripts/:"
            ls -la scripts/ 2>/dev/null || echo "   (scripts folder missing)"
            exit 1
          fi
          echo "✅ scripts/prerender.mjs exists"

      - name: Prerender listings
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node scripts/prerender.mjs

      - name: Verify output
        run: |
          COUNT=$(grep -c "property-card__title" index.html 2>/dev/null || echo "0")
          echo "Property cards in generated HTML: $COUNT"
          echo "PRERENDERED_LISTINGS_START markers: $(grep -c 'PRERENDERED_LISTINGS_START' index.html 2>/dev/null || echo 0)"
          if [ "$COUNT" -lt "1" ]; then
            echo "⚠️ WARNING: No property cards found — deploying with empty-state fallback."
            echo "   This means RLS is likely blocking anon reads on public.properties."
            echo "   Fix RLS in Supabase and re-run this workflow."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
