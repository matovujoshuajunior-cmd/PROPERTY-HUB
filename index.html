  <style>
    /* (same styles as before – kept for brevity) */
    body { background: #f8fafc; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    .property-card { transition: transform 0.2s ease, box-shadow 0.25s ease; }
    .property-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.18); }
    .hero-gradient { background: linear-gradient(135deg, rgba(15,23,42,0.88) 0%, rgba(30,58,95,0.72) 100%); }
    .filter-pill.active { background: #1e293b; color: #fff; border-color: #1e293b; }
    .filter-pill { transition: all 0.15s ease; cursor: pointer; user-select: none; }
    .filter-pill:hover { background: #e2e8f0; }
    .btn-whatsapp { background: #25d366; color: #fff; transition: background 0.2s; }
    .btn-whatsapp:hover { background: #1da851; }
    .broker-header { background: linear-gradient(145deg, #ffffff, #f1f5f9); border-bottom: 1px solid #e2e8f0; }
    .view { transition: opacity 0.25s ease; }
    .view-hidden { display: none; opacity: 0; }
    .view-visible { display: block; opacity: 1; }
    .auth-card { background: white; border-radius: 2rem; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }
    .auth-toggle-btn { transition: all 0.2s; cursor: pointer; }
    .auth-toggle-btn.active { background: #1e293b; color: white; border-color: #1e293b; }
    .auth-toggle-btn:hover:not(.active) { background: #f1f5f9; }
    .dashboard-card { background: white; border-radius: 1.5rem; box-shadow: 0 8px 30px rgba(0,0,0,0.05); }
    .dashboard-card:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.08); }
    #loadingOverlay {
      position: fixed; inset: 0; background: white; z-index: 9999;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem;
      transition: opacity 0.5s;
    }
    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }
    .loader {
      border: 4px solid #f3f4f6; border-top: 4px solid #4f46e5;
      border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;
      display: flex; align-items: center; justify-content: center;
      padding: 1rem;
      backdrop-filter: blur(4px);
    }
    .modal-backdrop.hidden { display: none; }
    .modal-content {
      background: white; border-radius: 2rem; max-width: 600px; width: 100%;
      max-height: 90vh; overflow-y: auto; padding: 2rem;
    }
    .image-thumb {
      position: relative; display: inline-block; margin: 0.25rem;
    }
    .image-thumb img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #e2e8f0; }
    .image-thumb .remove-img {
      position: absolute; top: -6px; right: -6px;
      background: #ef4444; color: white; border-radius: 50%;
      width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
      font-size: 12px; cursor: pointer; border: none;
    }
    .image-thumb .remove-img:hover { background: #dc2626; }

    .stars { color: #f59e0b; letter-spacing: 2px; }
    .stars .empty { color: #d1d5db; }
    .badge-lead { background: #10b981; color: white; padding: 0.1rem 0.5rem; border-radius: 9999px; font-size: 0.6rem; font-weight: bold; }

    .star-rating .star {
      cursor: pointer;
      font-size: 2rem;
      color: #d1d5db;
      transition: 0.15s;
    }
    .star-rating .star.active { color: #f59e0b; }
    .star-rating .star:hover { transform: scale(1.2); color: #f59e0b; }
    .star-rating .star:hover ~ .star { color: #d1d5db; }

    .badge-verified { background: #10b981; color: white; font-size: 0.6rem; padding: 0.1rem 0.5rem; border-radius: 9999px; display: inline-flex; align-items: center; gap: 0.25rem; font-weight: 600; animation: fadeIn 0.3s ease; }
    .badge-pending { background: #f59e0b; color: white; font-size: 0.6rem; padding: 0.1rem 0.5rem; border-radius: 9999px; display: inline-flex; align-items: center; gap: 0.25rem; font-weight: 600; }
    .badge-rejected { background: #ef4444; color: white; font-size: 0.6rem; padding: 0.1rem 0.5rem; border-radius: 9999px; display: inline-flex; align-items: center; gap: 0.25rem; font-weight: 600; }
    .badge-trusted { background: #f59e0b; color: #1e293b; font-size: 0.6rem; padding: 0.1rem 0.5rem; border-radius: 9999px; display: inline-flex; align-items: center; gap: 0.25rem; font-weight: 700; border: 1px solid #d97706; }

    @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

    .dashboard-toolbar {
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;
      background: white; padding: 1rem 1.25rem; border-radius: 1.5rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.05); margin-bottom: 1.5rem;
    }
    .wallet-pill {
      background: #1e293b; color: white; padding: 0.4rem 1rem; border-radius: 9999px;
      font-size: 0.875rem; font-weight: 600; display: inline-flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
    }
    .wallet-pill .balance { color: #34d399; }
    .wallet-pill .wallet-label { color: #94a3b8; font-weight: 400; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; }

    .dashboard-toolbar .toolbar-btn {
      padding: 0.4rem 1rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 500;
      border: none; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 0.5rem;
      background: #f1f5f9; color: #1e293b;
    }
    .dashboard-toolbar .toolbar-btn:hover { background: #e2e8f0; }
    .dashboard-toolbar .toolbar-btn.primary { background: #4f46e5; color: white; }
    .dashboard-toolbar .toolbar-btn.primary:hover { background: #4338ca; }
    .dashboard-toolbar .toolbar-btn.green { background: #10b981; color: white; }
    .dashboard-toolbar .toolbar-btn.green:hover { background: #059669; }
    .dashboard-toolbar .toolbar-btn.amber { background: #f59e0b; color: white; }
    .dashboard-toolbar .toolbar-btn.amber:hover { background: #d97706; }

    .profile-form-container, .add-property-container, .verification-form-container {
      background: white; border-radius: 1.5rem; padding: 1.25rem; margin-bottom: 1.5rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.05); display: none;
    }
    .profile-form-container.visible, .add-property-container.visible, .verification-form-container.visible { display: block; }

    .safety-banner { background: #fffbeb; border: 1px solid #fcd34d; border-radius: 0.75rem; padding: 0.75rem 1rem; margin-bottom: 1rem; display: flex; align-items: flex-start; gap: 0.75rem; }
    .security-notification {
      position: fixed; bottom: 20px; right: 20px; max-width: 380px; background: #1e293b; color: white;
      padding: 1rem 1.25rem; border-radius: 1rem; box-shadow: 0 20px 60px rgba(0,0,0,0.3); z-index: 999;
      display: none; animation: slideUp 0.5s ease;
    }
    .security-notification .close-btn { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; padding: 0 0 0 0.5rem; }
    .security-notification .close-btn:hover { color: white; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .verification-info-panel { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 0.75rem; padding: 0.75rem 1rem; margin-top: 0.5rem; display: none; font-size: 0.875rem; color: #0369a1; }
    .verification-info-panel.visible { display: block; }
    .verification-info-panel ul { list-style: disc; padding-left: 1.5rem; margin-top: 0.25rem; }

    .review-item { background: #f8fafc; border-radius: 0.75rem; padding: 0.75rem 1rem; border: 1px solid #e2e8f0; }
    .review-item .review-text { font-size: 0.875rem; color: #334155; }
    .review-item .review-meta { font-size: 0.75rem; color: #94a3b8; }
    .review-item .stars-small { letter-spacing: 1px; }

    .review-stats { display: flex; flex-wrap: wrap; gap: 1.5rem; margin-top: 0.5rem; }
    .review-stats .stat { display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: #475569; }
    .review-stats .stat .value { font-weight: 700; font-size: 1.125rem; color: #1e293b; }
    .review-stats .stat .label { color: #94a3b8; }

    .write-review-toggle { cursor: pointer; display: inline-flex; align-items: center; gap: 0.5rem; color: #4f46e5; font-weight: 500; transition: 0.2s; }
    .write-review-toggle:hover { color: #4338ca; }

    .verification-property-item {
      background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem;
      padding: 0.75rem 1rem; display: flex; flex-wrap: wrap; align-items: center;
      justify-content: space-between; gap: 0.5rem; margin-bottom: 0.5rem;
    }
    .verification-property-item .property-title { font-weight: 600; color: #1e293b; flex: 1; }
    .verification-property-item .property-status { font-size: 0.75rem; font-weight: 600; padding: 0.1rem 0.6rem; border-radius: 9999px; }
    .verification-property-item .property-status.approved { background: #d1fae5; color: #065f46; }
    .verification-property-item .property-status.pending { background: #fef3c7; color: #92400e; }
    .verification-property-item .property-status.rejected { background: #fee2e2; color: #991b1b; }
    .verification-property-item .property-status.unverified { background: #e2e8f0; color: #475569; }

    .detail-field { margin-bottom: 0.75rem; }
    .detail-field .label { font-weight: 600; color: #1e293b; font-size: 0.875rem; display: block; }
    .detail-field .value { color: #475569; word-break: break-all; }
    .detail-field .value a { color: #4f46e5; text-decoration: underline; }

    @media (max-width: 640px) {
      .dashboard-toolbar { flex-direction: column; align-items: stretch; padding: 0.75rem; }
      .dashboard-toolbar .wallet-pill { justify-content: center; }
      .dashboard-toolbar .toolbar-btn { justify-content: center; }
      .security-notification { bottom: 10px; right: 10px; left: 10px; max-width: unset; }
      .review-stats { gap: 1rem; }
      .verification-property-item { flex-direction: column; align-items: stretch; gap: 0.5rem; }
    }
  </style>

<body>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">

  <script>
    // ─── Supabase Config ──────────────────────────────────────────────
    const SUPABASE_URL = 'https://ubkgovgoifgpazkapaxi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVia2dvdmdvaWZncGF6a2FwYXhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MTExOTEsImV4cCI6MjEwMzI4NzE5MX0.upcDE6ucde7lsrPfPssWhoK54PNRDW701tkt2H4hP0A';

    // ─── State ──────────────────────────────────────────────────────────
    const state = {
      allProperties: [],
      filteredProperties: [],
      currentFilter: 'all',
      searchQuery: '',
      currentBrokerId: null,
      isLoading: false,
      currentUser: null,
      isSignUpMode: false,
      myProperties: [],
      profilesMap: {},
      walletBalance: 0,
      isAdmin: false,
    };

    let supabase;

    // ─── DOM refs ──────────────────────────────────────────────────────
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);

    const discoveryView = $('#discoveryView');
    const brokerView = $('#brokerView');
    const authView = $('#authView');
    const dashboardView = $('#dashboardView');

    const listingsGrid = $('#listingsGrid');
    const loadingSkeleton = $('#loadingSkeleton');
    const emptyState = $('#emptyState');
    const propertyCount = $('#propertyCount');
    const searchInput = $('#searchInput');
    const clearSearchBtn = $('#clearSearchBtn');
    const filterPills = $$('.filter-pill');

    // ─── Helper Functions ─────────────────────────────────────────────
    function formatPrice(amount) { return Number(amount).toLocaleString('en-UG') + ' UGX'; }

    function getImageArray(property) {
      const val = property.media_urls;
      if (!val) return [];
      if (Array.isArray(val)) return val;
      if (typeof val === 'string') return [val];
      return [];
    }

    function getImageUrl(property) {
      const arr = getImageArray(property);
      return arr.length > 0 ? arr[0] : 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=600&h=400&fit=crop&crop=center';
    }

    function renderStars(rating) {
      const full = Math.floor(rating);
      const half = rating % 1 >= 0.5 ? 1 : 0;
      const empty = 5 - full - half;
      let html = '';
      for (let i = 0; i < full; i++) html += '<i class="fas fa-star"></i>';
      if (half) html += '<i class="fas fa-star-half-alt"></i>';
      for (let i = 0; i < empty; i++) html += '<i class="far fa-star empty"></i>';
      return html;
    }

    function renderStarsSmall(rating) {
      const full = Math.floor(rating);
      const empty = 5 - full;
      let html = '';
      for (let i = 0; i < full; i++) html += '<i class="fas fa-star text-amber-400 text-xs"></i>';
      for (let i = 0; i < empty; i++) html += '<i class="far fa-star text-slate-300 text-xs"></i>';
      return html;
    }

    function navigateTo(url, replace = false) {
      if (replace) window.history.replaceState(null, '', url);
      else window.history.pushState(null, '', url);
      handleRoute();
    }

    function getCurrentPath() { return window.location.pathname + window.location.search; }

    function showView(view) {
      [discoveryView, brokerView, authView, dashboardView].forEach(v => {
        v.classList.remove('view-visible');
        v.classList.add('view-hidden');
      });
      view.classList.remove('view-hidden');
      view.classList.add('view-visible');
    }

    function setAuthMode(signUpModeActive) {
      state.isSignUpMode = signUpModeActive;
      if (signUpModeActive) {
        $('#toggleSignUp').classList.add('active');
        $('#toggleSignIn').classList.remove('active');
        $('#signUpFields').classList.remove('hidden');
        $('#formTitle').innerText = "Create Hub Space";
        $('#submitAuthBtn').innerText = "Register Business Hub";
      } else {
        $('#toggleSignIn').classList.add('active');
        $('#toggleSignUp').classList.remove('active');
        $('#signUpFields').classList.add('hidden');
        $('#formTitle').innerText = "Welcome Back";
        $('#submitAuthBtn').innerText = "Access Dashboard";
      }
    }

    // ─── Wallet ─────────────────────────────────────────────────────
    async function loadWallet() {
      if (!state.currentUser) return;
      try {
        const { data: profile, error } = await supabase
          .from('profiles')
          .select('wallet_balance')
          .eq('id', state.currentUser.id)
          .single();
        if (error) throw error;
        state.walletBalance = profile?.wallet_balance || 0;
        $('#walletBalanceDisplay').textContent = state.walletBalance.toLocaleString();
      } catch (err) {
        console.error('Error loading wallet:', err);
      }
    }

    async function depositWalletSimulated(amount) {
      if (!state.currentUser) return false;
      try {
        const { data, error } = await supabase.functions.invoke('deposit-wallet', {
          body: { amount }
        });
        if (error) throw error;
        await loadWallet();
        return true;
      } catch (err) {
        console.error('Deposit error:', err);
        alert('Error: ' + err.message);
        return false;
      }
    }

    // ─── Notifications ────────────────────────────────────────────────
    async function loadNotifications() {
      if (!state.currentUser) return;
      try {
        const { data, error } = await supabase
          .from('notifications')
          .select('*')
          .eq('user_id', state.currentUser.id)
          .eq('read', false)
          .order('created_at', { ascending: false });

        if (error) throw error;
        const count = data?.length || 0;
        const badge = $('#notificationCount');
        if (count > 0) {
          badge.textContent = count > 9 ? '9+' : count;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      } catch (err) {
        console.error('Error loading notifications:', err);
      }
    }

    $('#notificationBell').addEventListener('click', async function() {
      if (!state.currentUser) return;
      await supabase
        .from('notifications')
        .update({ read: true })
        .eq('user_id', state.currentUser.id)
        .eq('read', false);
      $('#notificationCount').classList.add('hidden');
      const { data, error } = await supabase
        .from('notifications')
        .select('*')
        .eq('user_id', state.currentUser.id)
        .order('created_at', { ascending: false })
        .limit(10);
      if (error) return;
      if (data.length === 0) { alert('No notifications.'); return; }
      let msg = '📬 Recent Notifications:\n\n';
      data.forEach(n => {
        msg += `📌 ${new Date(n.created_at).toLocaleString()}\n${n.title}: ${n.message}\n\n`;
      });
      alert(msg);
    });

    // ─── Top-up ────────────────────────────────────────────────────────
    $('#topupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const amount = parseInt($('#topupAmount').value);
      if (!amount || amount < 1000) {
        $('#topupStatus').textContent = 'Please enter a valid amount (min 1000 UGX).';
        $('#topupStatus').className = 'mt-3 text-sm text-red-600';
        return;
      }
      $('#topupStatus').textContent = 'Processing...';
      $('#topupStatus').className = 'mt-3 text-sm text-indigo-600';
      const success = await depositWalletSimulated(amount);
      if (success) {
        $('#topupStatus').textContent = `✅ Deposited ${amount.toLocaleString()} UGX!`;
        $('#topupStatus').className = 'mt-3 text-sm text-emerald-600';
        setTimeout(() => $('#topupModal').classList.add('hidden'), 1500);
      } else {
        $('#topupStatus').textContent = '❌ Deposit failed. Please try again.';
        $('#topupStatus').className = 'mt-3 text-sm text-red-600';
      }
    });

    $('#topupBtn').addEventListener('click', () => {
      $('#topupAmount').value = '';
      $('#topupStatus').textContent = '';
      $('#topupModal').classList.remove('hidden');
    });
    $('#closeTopupModal').addEventListener('click', () => $('#topupModal').classList.add('hidden'));
    $('#topupModal').addEventListener('click', (e) => { if (e.target === $('#topupModal')) $('#topupModal').classList.add('hidden'); });
    $('#refreshWalletBtn').addEventListener('click', loadWallet);

    // ─── Reviews ────────────────────────────────────────────────────────
    $('#toggleWriteReview').addEventListener('click', function() {
      const container = $('#reviewFormContainer');
      const isHidden = container.classList.contains('hidden');
      if (isHidden) {
        container.classList.remove('hidden');
        this.innerHTML = '<i class="fas fa-times"></i> Cancel';
      } else {
        container.classList.add('hidden');
        this.innerHTML = '<i class="fas fa-pen"></i> Write a Review';
      }
    });

    async function loadReviewsForModal(brokerId) {
      const reviewsList = $('#reviewsList');
      reviewsList.innerHTML = '<p class="text-slate-500 text-sm">Loading reviews...</p>';
      $('#noReviewsMessage').classList.add('hidden');
      try {
        const { data, error } = await supabase
          .from('reviews')
          .select('*')
          .eq('broker_id', brokerId)
          .order('created_at', { ascending: false });
        if (error) throw error;
        if (!data || data.length === 0) {
          reviewsList.innerHTML = '';
          $('#noReviewsMessage').classList.remove('hidden');
          return;
        }
        let html = '';
        data.forEach(review => {
          const stars = renderStarsSmall(review.rating);
          const date = new Date(review.created_at).toLocaleDateString('en-UG', { day: 'numeric', month: 'short', year: 'numeric' });
          const reviewer = review.client_name || 'Guest';
          html += `
            <div class="review-item">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <span class="font-medium text-slate-700">${reviewer}</span>
                  <span class="stars-small">${stars}</span>
                </div>
                <span class="review-meta">${date}</span>
              </div>
              ${review.comment ? `<p class="review-text mt-1">${review.comment}</p>` : ''}
            </div>
          `;
        });
        reviewsList.innerHTML = html;
      } catch (err) {
        reviewsList.innerHTML = `<p class="text-red-500 text-sm">Error loading reviews: ${err.message}</p>`;
      }
    }

    async function openReviewModal(brokerId) {
      $('#reviewBrokerId').value = brokerId;
      $('#reviewRating').value = 5;
      $('#reviewComment').value = '';
      $('#reviewClientName').value = '';
      updateStarUI(5);
      $('#reviewFormContainer').classList.add('hidden');
      $('#toggleWriteReview').innerHTML = '<i class="fas fa-pen"></i> Write a Review';
      $('#reviewModal').classList.remove('hidden');
      await loadReviewsForModal(brokerId);
    }

    // ─── Star selector ────────────────────────────────────────────────
    const starSelector = $('#starSelector');
    starSelector.querySelectorAll('.star').forEach(star => {
      star.addEventListener('click', () => {
        const val = parseInt(star.dataset.value);
        $('#reviewRating').value = val;
        updateStarUI(val);
      });
      star.addEventListener('mouseenter', () => {
        const val = parseInt(star.dataset.value);
        updateStarUI(val);
      });
      star.addEventListener('mouseleave', () => {
        const current = parseInt($('#reviewRating').value) || 5;
        updateStarUI(current);
      });
    });

    function updateStarUI(active) {
      starSelector.querySelectorAll('.star').forEach(el => {
        const val = parseInt(el.dataset.value);
        el.classList.toggle('active', val <= active);
      });
    }

    // ─── Ranking ────────────────────────────────────────────────────
    function isTrustedBroker(broker) {
      if (!broker) return false;
      const rating = broker.average_rating || 0;
      const reviewCount = broker.review_count || 0;
      const leadScore = broker.lead_score || 0;
      const reportCount = broker.report_count || 0;
      return rating >= 4.0 && reviewCount >= 10 && leadScore >= 20 && reportCount < 3;
    }

    function calculateRankScore(property, broker, reportCount = 0) {
      let score = 0;
      if (property.verification_status === 'approved') {
        score += 100;
      } else if (property.verification_status === 'pending') {
        score += 30;
      }
      if (broker) {
        const rating = broker.average_rating || 0;
        const reviewCount = broker.review_count || 0;
        score += rating * 10;
        score += Math.min(reviewCount, 50) * 0.5;
        if (isTrustedBroker(broker)) {
          score += 20;
        }
        const leadScore = broker.lead_score || 0;
        score += leadScore / 2;
        score -= (reportCount || 0) * 5;
      }
      return Math.round(score);
    }

    // ─── Property Verification ──────────────────────────────────────
    async function loadPropertyVerificationList() {
      if (!state.currentUser) return;
      try {
        const { data: properties, error: pErr } = await supabase
          .from('properties')
          .select(`
            *,
            verification_requests:property_verification_requests (
              id, status, submitted_data, created_at
            )
          `)
          .eq('owner_id', state.currentUser.id)
          .order('created_at', { ascending: false });

        if (pErr) throw pErr;

        const list = $('#propertyVerificationList');
        const empty = $('#propertyVerificationEmpty');

        if (!properties || properties.length === 0) {
          list.innerHTML = '';
          empty.classList.remove('hidden');
          return;
        }
        empty.classList.add('hidden');

        let html = '';
        properties.forEach(prop => {
          const req = prop.verification_requests?.[0] || null;
          const status = req ? req.status : 'Not requested';
          const statusClass = status === 'approved' ? 'approved' :
                             status === 'pending' ? 'pending' :
                             status === 'rejected' ? 'rejected' : 'unverified';
          const statusLabel = status === 'approved' ? '✅ Approved' :
                             status === 'pending' ? '⏳ Pending' :
                             status === 'rejected' ? '❌ Rejected' : 'Not requested';

          const canRequest = (!req || req.status === 'rejected') && status !== 'pending';

          html += `
            <div class="verification-property-item">
              <div class="property-title">${prop.title || 'Untitled'}</div>
              <div><span class="property-status ${statusClass}">${statusLabel}</span></div>
              <div>
                ${canRequest ? `<button class="request-verification-btn text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-full transition" data-property-id="${prop.id}">Request Verification</button>` :
                `<span class="text-xs text-slate-400">${status === 'approved' ? 'Verified' : 'In progress'}</span>`}
                ${req ? `<button class="view-verification-details text-xs text-blue-600 hover:underline ml-2" data-request-id="${req.id}">Details</button>` : ''}
              </div>
            </div>
          `;
        });
        list.innerHTML = html;

        list.querySelectorAll('.request-verification-btn').forEach(btn => {
          btn.addEventListener('click', function() {
            openPropertyVerificationModal(this.dataset.propertyId);
          });
        });

        list.querySelectorAll('.view-verification-details').forEach(btn => {
          btn.addEventListener('click', async function() {
            const requestId = this.dataset.requestId;
            const { data: req, error } = await supabase
              .from('property_verification_requests')
              .select('submitted_data, status, created_at')
              .eq('id', requestId)
              .single();
            if (error) {
              alert('Error loading details.');
              return;
            }
            const data = req.submitted_data;
            let msg = `Status: ${req.status}\nSubmitted: ${new Date(req.created_at).toLocaleString()}\n\n`;
            for (const [key, value] of Object.entries(data)) {
              msg += `${key}: ${value}\n`;
            }
            alert(msg);
          });
        });

      } catch (err) {
        console.error('Error loading property verifications:', err);
        $('#propertyVerificationList').innerHTML = `<p class="text-red-500 text-sm">Error loading: ${err.message}</p>`;
      }
    }

          .from('lead_requests')
          .select('*, property:property_id (title, price_amount, property_type, address)')

          return;
        }
        noMsg.classList.add('hidden');

        let html = '';
        data.forEach(lead => {
          const statusClass = lead.status === 'approved' ? 'approved' :
                             lead.status === 'pending' ? 'pending' :
                             lead.status === 'rejected' ? 'rejected' : 'expired';
          const statusLabel = lead.status === 'approved' ? '✅ Unlocked' :
                             lead.status === 'pending' ? '⏳ Pending' :
                             lead.status === 'rejected' ? '❌ Rejected' : '⏰ Expired';

          const canUnlock = lead.status === 'pending';

          html += `
            <div class="verification-property-item">
              <div class="property-title">${lead.property?.title || 'Unknown'} <span class="text-xs text-slate-400">(${lead.lead_type})</span></div>
              <div><span class="property-status ${statusClass}">${statusLabel}</span></div>

                lead.status === 'approved' ? `<button class="view-lead-details text-xs text-blue-600 hover:underline" data-lead-id="${lead.id}">View Contact</button>` :
                `<span class="text-xs text-slate-400">Free</span>`}
              </div>
            </div>
          `;
        });
        list.innerHTML = html;

        list.querySelectorAll('.unlock-lead-btn').forEach(btn => {
          btn.addEventListener('click', async function() {
            const leadId = this.dataset.leadId;
            if (!confirm('Unlock this lead? (Free)')) return;
            try {
              const { data, error } = await supabase.functions.invoke('handle-lead-decision', {
                body: { token: leadId, decision: 'approve' }
              });
              if (error) throw error;
              if (!data.success) {
                alert('Failed to unlock lead: ' + data.error);
                return;
              }
              alert(`✅ Lead unlocked!\n\nName: ${data.visitor_name}\nEmail: ${data.visitor_email}\nWhatsApp: ${data.visitor_whatsapp}`);
              loadLeads();
              loadWallet();
              loadNotifications();
            } catch (err) {
              alert('Error: ' + err.message);
            }
          });
        });

        list.querySelectorAll('.view-lead-details').forEach(btn => {
          btn.addEventListener('click', async function() {
            const leadId = this.dataset.leadId;
            const { data: lead, error } = await supabase
              .from('lead_requests')
              .select('visitor_name, visitor_email, visitor_whatsapp, unlocked_at')
              .eq('id', leadId)
              .single();
            if (error) { alert('Error loading details'); return; }
            alert(`Contact Details:\n\nName: ${lead.visitor_name}\nEmail: ${lead.visitor_email}\nWhatsApp: ${lead.visitor_whatsapp}\nUnlocked: ${new Date(lead.unlocked_at).toLocaleString()}`);
          });
        });

      } catch (err) {
        console.error('Error loading leads:', err);
        $('#leadsList').innerHTML = '<p class="text-red-500 text-sm">Error loading leads.</p>';
      }
    }

    async function openEditModal(propertyId) {
      const prop = state.myProperties.find(p => p.id === propertyId);
      if (!prop) return;
      $('#editPropertyId').value = propertyId;
      $('#editTitle').value = prop.title || '';
      $('#editPrice').value = prop.price_amount || '';
      const dbType = prop.property_type || '';
      let formType = 'Rentals';

    // ─── Fetch all data ──────────────────────────────────────────────
    async function fetchAllData() {
      state.isLoading = true;
      loadingSkeleton.style.display = 'grid';
      listingsGrid.innerHTML = '';
      emptyState.classList.add('hidden');

      try {
        const { data: properties, error: propError } = await supabase
          .from('properties')
          .select('*')
          .order('created_at', { ascending: false });

        if (propError) throw propError;

        if (!properties || properties.length === 0) {
          loadingSkeleton.style.display = 'none';
          state.allProperties = [];
          state.filteredProperties = [];
          renderListings([]);
          state.isLoading = false;
          return;
        }

        // Get profiles for brokers
        const ownerIds = [...new Set(properties.map(p => p.owner_id).filter(id => id))];
        let profilesMap = {};
        if (ownerIds.length > 0) {
          const { data: profiles, error: profError } = await supabase
            .from('profiles')
            .select('*')
            .in('id', ownerIds);
          if (!profError && profiles) {
            profilesMap = Object.fromEntries(profiles.map(p => [p.id, p]));
          }
        }
        state.profilesMap = profilesMap;

        // Get reports count
        const { data: reports } = await supabase
          .from('reports')
          .select('broker_id, status')
          .eq('status', 'pending');

        if (reports) {
          const reportCounts = {};
          reports.forEach(r => {
            reportCounts[r.broker_id] = (reportCounts[r.broker_id] || 0) + 1;
          });
          Object.keys(profilesMap).forEach(id => {
            profilesMap[id].report_count = reportCounts[id] || 0;
          });
        }

        const enriched = properties.map(prop => {
          const broker = profilesMap[prop.owner_id] || null;
          const reportCount = broker?.report_count || 0;
          const rankScore = calculateRankScore(prop, broker, reportCount);
          return { ...prop, broker, rankScore };
        });

        enriched.sort((a, b) => b.rankScore - a.rankScore);

        state.allProperties = enriched;
        state.filteredProperties = [...enriched];
        applyFiltersAndSearch();
      } catch (err) {
        console.error('❌ Error fetching data:', err);
        listingsGrid.innerHTML = `
          <div class="col-span-full text-center py-12 text-slate-500">
            <i class="fas fa-exclamation-triangle text-3xl text-amber-400 mb-3"></i>
            <p>Failed to load properties.</p>
            <p class="text-xs text-slate-400 mt-1">${err.message}</p>
          </div>
        `;
      } finally {
        state.isLoading = false;
        loadingSkeleton.style.display = 'none';
      }
    }

    function applyFiltersAndSearch() {
      const filter = state.currentFilter;
      const query = state.searchQuery.trim().toLowerCase();
      let result = [...state.allProperties];

      if (filter !== 'all') {
        result = result.filter(p => {
          const dbType = (p.property_type || '').toLowerCase();
          return dbType === filter;
        });
      }

      if (query) {
        result = result.filter(p => {
          const address = (p.address || '').toLowerCase();
          const title = (p.title || '').toLowerCase();
          return address.includes(query) || title.includes(query);
        });
      }

      state.filteredProperties = result;
      renderListings(result);
    }

    function subscribeToLeadRequest(requestId) {

        const { data, error } = await supabase
          .from('lead_requests')
          .select('status')
          .eq('id', requestId)
          .single();
        if (error) return;
        if (data.status === 'approved') {
          clearInterval(interval);
          $('#waitingModal').classList.add('hidden');
          alert('✅ Lead approved! The broker will contact you shortly.');
          loadNotifications();
        } else if (data.status === 'rejected') {
          clearInterval(interval);
          $('#waitingModal').classList.add('hidden');
          alert('❌ The broker declined this request.');
        }
      }, 3000);
    }

    async function init() {
      const hash = window.location.hash;
      if (hash && hash.includes('access_token')) {
        const params = new URLSearchParams(hash.substring(1));
        const accessToken = params.get('access_token');
        const refreshToken = params.get('refresh_token');
        if (accessToken && refreshToken) {
          try {
            const { data, error } = await supabase.auth.setSession({
              access_token: accessToken,
              refresh_token: refreshToken,
            });
            if (error) throw error;
            if (data.user) {
              state.currentUser = data.user;
              $('#portalBtnLabel').textContent = 'Dashboard';
              window.history.replaceState(null, '', '/');
              showView(dashboardView);
              navigateTo('/dashboard');
              await loadProfileSettings();
              await loadMyProperties();
              await loadWallet();
              await fetchAllData();
              loadNotifications();
              loadLeads();
              alert('✅ Email verified! Welcome to your dashboard.');
              return;
            }
          } catch (err) {
            console.error('Session set error:', err);
            alert('❌ Verification failed: ' + err.message);
          }
        }
      }

      try {
        const { data: { user } } = await supabase.auth.getUser();
        if (user) {
          state.currentUser = user;
          $('#portalBtnLabel').textContent = 'Dashboard';
          await loadProfileSettings();
          await loadWallet();
        }
      } catch (err) {
        console.log('No active session (403 is normal).');
      }

      await handleRoute();
      await fetchAllData();

      setTimeout(() => {
        $('#securityNotification').style.display = 'block';
      }, 3000);

      $('#closeSecurityNotification').addEventListener('click', () => {
        $('#securityNotification').style.display = 'none';
      });

      hideLoading();
    }

    function hideLoading() {
      $('#loadingOverlay').classList.add('hidden');
    }

    // ─── Start ──────────────────────────────────────────────────────
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', async () => {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        await init();
      });
    } else {
      supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      init();
    }
  </script>
</body>
</html>
