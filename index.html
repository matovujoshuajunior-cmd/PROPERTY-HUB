    .dashboard-card:hover { box-shadow: 0 12px 40px rgba(0,0,0,0.08); }

    #loadingOverlay.hidden { opacity: 0; pointer-events: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

      position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000;

    .verification-property-item {

    .verification-property-item .property-status.approved { background: #d1fae5; color: #065f46; }
    .verification-property-item .property-status.pending { background: #fef3c7; color: #92400e; }
    .verification-property-item .property-status.rejected { background: #fee2e2; color: #991b1b; }
    .verification-property-item .property-status.unverified { background: #e2e8f0; color: #475569; }

    .detail-field { margin-bottom: 0.75rem; }
    .detail-field .label { font-weight: 600; color: #1e293b; font-size: 0.875rem; display: block; }
    .detail-field .value { color: #475569; word-break: break-all; }
    .detail-field .value a { color: #4f46e5; text-decoration: underline; }

    @media (max-width: 640px) {
      .dashboard-toolbar { flex-direction: column; align-items: stretch; padding: 0.75rem; }
      .dashboard-toolbar .wallet-pill { justify-content: center; }
      .dashboard-toolbar .toolbar-btn { justify-content: center; }
      .security-notification { bottom: 10px; right: 10px; left: 10px; max-width: unset; }
      .review-stats { gap: 1rem; }
      .verification-property-item { flex-direction: column; align-items: stretch; gap: 0.5rem; }

  </style>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js">

  <script>
    (function() {
      'use strict';

      // ─── Config ──────────────────────────────────────────────────────────
      const SUPABASE_URL = 'https://ubkgovgoifgpazkapaxi.supabase.co';
      const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVia2dvdmdvaWZncGF6a2FwYXhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MTExOTEsImV4cCI6MjEwMzI4NzE5MX0.upcDE6ucde7lsrPfPssWhoK54PNRDW701tkt2H4hP0A';

      // ─── State ────────────────────────────────────────────────────────────
      const state = {
        allProperties: [],
        filteredProperties: [],
        currentFilter: 'all',
        searchQuery: '',
        currentBrokerId: null,
        isLoading: false,
        currentUser: null,
        isSignUpMode: false,
        myProperties: [],
        profilesMap: {},
        walletBalance: 0,
        isAdmin: false,
      };

      let supabase;

      // ─── DOM helpers (safe) ─────────────────────────────────────────────
      function $(sel) { return document.querySelector(sel); }
      function $$(sel) { return document.querySelectorAll(sel); }

      // ─── Show/hide views ──────────────────────────────────────────────
      function showView(view) {
        [document.getElementById('discoveryView'),
         document.getElementById('brokerView'),
         document.getElementById('authView'),
         document.getElementById('dashboardView')].forEach(v => {
           if (v) {
             v.classList.remove('view-visible');
             v.classList.add('view-hidden');
           }
         });
        if (view) {
          view.classList.remove('view-hidden');
          view.classList.add('view-visible');
        }
      }

      // ─── Navigate ──────────────────────────────────────────────────────
      function navigateTo(url, replace = false) {
        if (replace) window.history.replaceState(null, '', url);
        else window.history.pushState(null, '', url);
        handleRoute();
      }

      function getCurrentPath() {
        return window.location.pathname + window.location.search;
      }

      // ─── Helper functions ─────────────────────────────────────────────
      function formatPrice(amount) {
        return Number(amount).toLocaleString('en-UG') + ' UGX';
      }

      function getImageArray(property) {
        const val = property.media_urls;
        if (!val) return [];
        if (Array.isArray(val)) return val;
        if (typeof val === 'string') return [val];
        return [];
      }

      function getImageUrl(property) {
        const arr = getImageArray(property);
        return arr.length > 0 ? arr[0] : 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=600&h=400&fit=crop&crop=center';
      }

      function renderStars(rating) {
        const full = Math.floor(rating);
        const half = rating % 1 >= 0.5 ? 1 : 0;
        const empty = 5 - full - half;
        let html = '';
        for (let i = 0; i < full; i++) html += '<i class="fas fa-star"></i>';
        if (half) html += '<i class="fas fa-star-half-alt"></i>';
        for (let i = 0; i < empty; i++) html += '<i class="far fa-star empty"></i>';
        return html;
      }

      function renderStarsSmall(rating) {
        const full = Math.floor(rating);
        const empty = 5 - full;
        let html = '';
        for (let i = 0; i < full; i++) html += '<i class="fas fa-star text-amber-400 text-xs"></i>';
        for (let i = 0; i < empty; i++) html += '<i class="far fa-star text-slate-300 text-xs"></i>';
        return html;
      }

      // ─── Authentication helpers ──────────────────────────────────────
      function setAuthMode(signUpModeActive) {
        state.isSignUpMode = signUpModeActive;
        const signIn = document.getElementById('toggleSignIn');
        const signUp = document.getElementById('toggleSignUp');
        const fields = document.getElementById('signUpFields');
        const title = document.getElementById('formTitle');
        const btn = document.getElementById('submitAuthBtn');
        if (!signIn || !signUp || !fields || !title || !btn) return;
        if (signUpModeActive) {
          signUp.classList.add('active');
          signIn.classList.remove('active');
          fields.classList.remove('hidden');
          title.innerText = 'Create Hub Space';
          btn.innerText = 'Register Business Hub';
        } else {
          signIn.classList.add('active');
          signUp.classList.remove('active');
          fields.classList.add('hidden');
          title.innerText = 'Welcome Back';
          btn.innerText = 'Access Dashboard';
        }
      }

      // ─── Wallet ──────────────────────────────────────────────────────
      async function loadWallet() {
        if (!state.currentUser) return;
        try {
          const { data: profile, error } = await supabase
            .from('profiles')
            .select('wallet_balance')
            .eq('id', state.currentUser.id)
            .single();
          if (error) throw error;
          state.walletBalance = profile?.wallet_balance || 0;
          const el = document.getElementById('walletBalanceDisplay');
          if (el) el.textContent = state.walletBalance.toLocaleString();
        } catch (err) {
          console.error('Error loading wallet:', err);
        }
      }

      async function depositWalletSimulated(amount) {
        if (!state.currentUser) return false;
        try {
          const { data, error } = await supabase.functions.invoke('deposit-wallet', {
            body: { amount }
          });
          if (error) throw error;
          await loadWallet();
          return true;
        } catch (err) {
          console.error('Deposit error:', err);
          alert('Error: ' + err.message);
          return false;
        }
      }

      // ─── Notifications ──────────────────────────────────────────────
      async function loadNotifications() {
        if (!state.currentUser) return;
        try {
          const { data, error } = await supabase
            .from('notifications')
            .select('*')
            .eq('user_id', state.currentUser.id)
            .eq('read', false)
            .order('created_at', { ascending: false });
          if (error) throw error;
          const count = data?.length || 0;
          const badge = document.getElementById('notificationCount');
          if (badge) {
            if (count > 0) {
              badge.textContent = count > 9 ? '9+' : count;
              badge.classList.remove('hidden');
            } else {
              badge.classList.add('hidden');
            }
          }
        } catch (err) {
          console.error('Error loading notifications:', err);
        }
      }

      // ─── Ranking ────────────────────────────────────────────────────
      function isTrustedBroker(broker) {
        if (!broker) return false;
        const rating = broker.average_rating || 0;
        const reviewCount = broker.review_count || 0;
        const leadScore = broker.lead_score || 0;
        const reportCount = broker.report_count || 0;
        return rating >= 4.0 && reviewCount >= 10 && leadScore >= 20 && reportCount < 3;
      }

      function calculateRankScore(property, broker, reportCount = 0) {
        let score = 0;
        if (property.verification_status === 'approved') {
          score += 100;
        } else if (property.verification_status === 'pending') {
          score += 30;
        }
        if (broker) {
          const rating = broker.average_rating || 0;
          const reviewCount = broker.review_count || 0;
          score += rating * 10;
          score += Math.min(reviewCount, 50) * 0.5;
          if (isTrustedBroker(broker)) score += 20;
          const leadScore = broker.lead_score || 0;
          score += leadScore / 2;
          score -= (reportCount || 0) * 5;
        }
        return Math.round(score);
      }

      // ─── Property Card ──────────────────────────────────────────────
      function createPropertyCard(property, broker, showBrokerLink = true, showEdit = false) {
        const article = document.createElement('article');
        article.className = 'property-card bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200/70 flex flex-col';

        const imageUrl = getImageUrl(property);
        const rating = broker?.average_rating || 0;
        const reviewCount = broker?.review_count || 0;
        const leadScore = broker?.lead_score || 0;
        const isOwner = state.currentUser && broker && state.currentUser.id === broker.id;

        const verificationStatus = property.verification_status || 'pending';
        const isVerified = verificationStatus === 'approved';
        const isTrusted = broker ? isTrustedBroker(broker) : false;
        const reportCount = broker?.report_count || 0;
        const rankScore = property.rankScore || calculateRankScore(property, broker, reportCount);

        let badgeHtml = '';
        if (isVerified) {
          badgeHtml = `<span class="badge-verified"><i class="fas fa-check-circle"></i> Verified</span>`;
        } else if (verificationStatus === 'pending') {
          badgeHtml = `<span class="badge-pending"><i class="fas fa-clock"></i> Pending</span>`;
        } else if (verificationStatus === 'rejected') {
          badgeHtml = `<span class="badge-rejected"><i class="fas fa-times-circle"></i> Rejected</span>`;
        }

        let trustedHtml = '';
        if (isTrusted) {
          trustedHtml = `<span class="badge-trusted"><i class="fas fa-star"></i> Trusted</span>`;
        }

        let actionsHtml = '';
        if (showEdit) actionsHtml += `<button class="edit-btn text-xs text-indigo-600 hover:text-indigo-800 font-medium" data-id="${property.id}"><i class="fas fa-edit mr-1"></i>Edit</button>`;
        let boostHtml = '';
        if (showEdit && state.currentUser) {
          boostHtml = `<button class="boost-btn text-xs text-emerald-600 hover:text-emerald-800 font-medium ml-2" data-broker-id="${state.currentUser.id}"><i class="fas fa-rocket mr-1"></i>Boost</button>`;
        }
        let rateHtml = '';
        if (state.currentUser && broker && !isOwner) {
          rateHtml = `<button class="rate-btn text-xs text-yellow-600 hover:text-yellow-800 font-medium" data-broker-id="${broker.id}"><i class="fas fa-star mr-1"></i>Rate</button>`;
        }

        article.innerHTML = `
          <div class="relative aspect-[4/3] bg-slate-200 overflow-hidden">
            <img src="${imageUrl}" alt="${property.title || 'Property'}" 
                 class="w-full h-full object-cover" loading="lazy"
                 onerror="this.src='https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=600&h=400&fit=crop&crop=center'"/>
            <span class="absolute bottom-3 right-3 bg-black/60 backdrop-blur-sm text-white text-xs px-3 py-1 rounded-full">
              ${property.property_type || 'Property'}
            </span>
            ${!showEdit && isVerified ? `<span class="absolute top-3 right-3 bg-emerald-600 text-white text-[8px] font-bold px-2 py-1 rounded-full shadow-md"><i class="fas fa-check-circle mr-1"></i>VERIFIED</span>` : ''}
          </div>
          <div class="p-4 flex flex-col flex-1">
            <div class="flex items-center justify-between flex-wrap gap-1">
              <h3 class="font-semibold text-slate-800 text-base leading-snug line-clamp-1">${property.title || 'Untitled'}</h3>
              <div class="flex items-center gap-1">
                ${!showEdit ? badgeHtml : ''}
                ${!showEdit && isTrusted ? trustedHtml : ''}
              </div>
            </div>
            <p class="text-indigo-700 font-bold text-sm mt-0.5">${formatPrice(property.price_amount)}</p>
            <p class="text-slate-500 text-xs flex items-center gap-1 mt-0.5">
              <i class="fas fa-map-pin text-slate-400 text-[10px]"></i>
              <span class="line-clamp-1">${property.address || 'Location not specified'}</span>
            </p>
            <div class="mt-2 flex items-center gap-2 text-xs">
              <span class="stars text-xs">${renderStars(rating)}</span>
              <span class="text-slate-500">(${reviewCount})</span>
              <span class="badge-lead">⚡ ${leadScore}</span>
            </div>
            ${!showEdit ? `<div class="mt-1 flex items-center gap-2 text-xs text-slate-400"><span>Rank Score: ${rankScore}</span>${reportCount > 0 ? `<span class="text-red-500"><i class="fas fa-exclamation-triangle"></i> ${reportCount} report${reportCount > 1 ? 's' : ''}</span>` : ''}</div>` : ''}
            <div class="mt-3 flex items-center justify-between gap-2 border-t border-slate-100 pt-3 flex-wrap">
              ${showBrokerLink ? `<button class="broker-name-link text-xs font-medium text-indigo-600 hover:text-indigo-800 hover:underline flex items-center gap-1 cursor-pointer" data-broker-id="${broker?.id || ''}">
                <i class="fas fa-user-circle text-slate-400"></i> ${broker?.business_name || 'Unknown Broker'}
                ${isTrusted ? `<span class="text-amber-500 text-[10px]"><i class="fas fa-star"></i></span>` : ''}
              </button>` : `<span class="text-xs text-slate-500 flex items-center gap-1"><i class="fas fa-user-circle text-slate-400"></i> ${broker?.business_name || 'Broker'}</span>`}
              <div class="flex gap-2">
                ${actionsHtml}
                ${boostHtml}
                ${rateHtml}
                <button class="connect-btn bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm hover:shadow transition" data-property-id="${property.id}">
                  <i class="fas fa-handshake"></i> Connect
                </button>
              </div>
            </div>
          </div>
        `;

        // ─── Add event listeners with safe checks ──────────────────
        const editBtn = article.querySelector('.edit-btn');
        if (editBtn) editBtn.addEventListener('click', (e) => { e.stopPropagation(); openEditModal(property.id); });
        const boostBtn = article.querySelector('.boost-btn');
        if (boostBtn) {
          boostBtn.addEventListener('click', async (e) => {
            e.stopPropagation();
            const brokerId = e.currentTarget.dataset.brokerId;
            try {
              const { error } = await supabase.rpc('increment_lead_score', { broker_id: brokerId, amount: 5 });
              if (error) throw error;
              alert('✅ Lead score boosted by 5!');
              await fetchAllData();
              if (state.currentUser) await loadMyProperties();
            } catch (err) { alert('Error boosting lead score: ' + err.message); }
          });
        }
        const rateBtn = article.querySelector('.rate-btn');
        if (rateBtn) rateBtn.addEventListener('click', (e) => { e.stopPropagation(); openReviewModal(broker.id); });
        const nameLink = article.querySelector('.broker-name-link');
        if (nameLink) nameLink.addEventListener('click', (e) => { e.stopPropagation(); navigateToBroker(broker.id); });
        const connectBtn = article.querySelector('.connect-btn');
        if (connectBtn) {
          connectBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            if (!state.currentUser) { alert('Please sign in.'); navigateToAuth(); return; }
            openQuizModal(property.id);
          });
        }
        return article;
      }

      // ─── Render functions ──────────────────────────────────────────
      function renderListings(properties) {
        const grid = document.getElementById('listingsGrid');
        if (!grid) return;
        grid.innerHTML = '';
        if (!properties || properties.length === 0) {
          const empty = document.getElementById('emptyState');
          if (empty) empty.classList.remove('hidden');
          const count = document.getElementById('propertyCount');
          if (count) count.textContent = '0 listings';
          return;
        }
        const empty = document.getElementById('emptyState');
        if (empty) empty.classList.add('hidden');
        const count = document.getElementById('propertyCount');
        if (count) count.textContent = `${properties.length} listing${properties.length > 1 ? 's' : ''}`;
        properties.forEach(prop => {
          const broker = prop.broker || state.profilesMap[prop.owner_id] || null;
          const card = createPropertyCard(prop, broker, true, false);
          grid.appendChild(card);
        });
      }

      function renderMyProperties() {
        const list = document.getElementById('myPropertiesList');
        if (!list) return;
        list.innerHTML = '';
        if (state.myProperties.length === 0) {
          const empty = document.getElementById('myPropertiesEmpty');
          if (empty) empty.classList.remove('hidden');
          return;
        }
        const empty = document.getElementById('myPropertiesEmpty');
        if (empty) empty.classList.add('hidden');
        state.myProperties.forEach(prop => {
          const broker = state.currentUser;
          const card = createPropertyCard(prop, broker, false, true);
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'mt-2 text-xs text-red-500 hover:text-red-700 font-medium';
          deleteBtn.innerHTML = '<i class="fas fa-trash mr-1"></i> Remove';
          deleteBtn.addEventListener('click', async () => {
            if (confirm('Delete this property?')) {
              await deleteProperty(prop.id);
            }
          });
          card.querySelector('.p-4').appendChild(deleteBtn);
          list.appendChild(card);
        });
      }

      // ─── CRUD ──────────────────────────────────────────────────────
      async function deleteProperty(propId) {
        try {
          const { error } = await supabase.from('properties').delete().eq('id', propId);
          if (error) throw error;
          state.myProperties = state.myProperties.filter(p => p.id !== propId);
          renderMyProperties();
          await fetchAllData();
        } catch (err) { alert('Delete failed: ' + err.message); }
      }

      async function openEditModal(propertyId) {
        // Implement edit modal logic (similar to previous)
        alert('Edit property ' + propertyId);
      }

      // ─── Quiz ──────────────────────────────────────────────────────
      async function openQuizModal(propertyId) {
        // Implement quiz modal logic
        alert('Open quiz for property ' + propertyId);
      }

      // ─── Reviews ────────────────────────────────────────────────────
      async function openReviewModal(brokerId) {
        // Implement review modal
        alert('Open reviews for broker ' + brokerId);
      }

      // ─── Navigation ────────────────────────────────────────────────
      async function navigateToBroker(brokerId) {
        // Implement broker profile navigation
        alert('Navigate to broker ' + brokerId);
      }

      function navigateToAuth() {
        showView(document.getElementById('authView'));
        navigateTo('/auth');
        setAuthMode(false);
      }

      // ─── Fetch all data ──────────────────────────────────────────────
      async function fetchAllData() {
        const grid = document.getElementById('listingsGrid');
        const skeleton = document.getElementById('loadingSkeleton');
        const empty = document.getElementById('emptyState');
        if (skeleton) skeleton.style.display = 'grid';
        if (grid) grid.innerHTML = '';
        if (empty) empty.classList.add('hidden');

        try {
          const { data: properties, error: propError } = await supabase
            .from('properties')
            .select('*')
            .order('created_at', { ascending: false });

          if (propError) throw propError;

          if (!properties || properties.length === 0) {
            if (skeleton) skeleton.style.display = 'none';
            state.allProperties = [];
            state.filteredProperties = [];
            renderListings([]);
            return;
          }

          // Get broker profiles
          const ownerIds = [...new Set(properties.map(p => p.owner_id).filter(id => id))];
          let profilesMap = {};
          if (ownerIds.length > 0) {
            const { data: profiles, error: profError } = await supabase
              .from('profiles')
              .select('*')
              .in('id', ownerIds);
            if (!profError && profiles) {
              profilesMap = Object.fromEntries(profiles.map(p => [p.id, p]));
            }
          }
          state.profilesMap = profilesMap;

          // Get report counts
          const { data: reports } = await supabase
            .from('reports')
            .select('broker_id, status')
            .eq('status', 'pending');
          if (reports) {
            const reportCounts = {};
            reports.forEach(r => { reportCounts[r.broker_id] = (reportCounts[r.broker_id] || 0) + 1; });
            Object.keys(profilesMap).forEach(id => {
              profilesMap[id].report_count = reportCounts[id] || 0;
            });
          }

          const enriched = properties.map(prop => {
            const broker = profilesMap[prop.owner_id] || null;
            const reportCount = broker?.report_count || 0;
            const rankScore = calculateRankScore(prop, broker, reportCount);
            return { ...prop, broker, rankScore };
          });
          enriched.sort((a, b) => b.rankScore - a.rankScore);

          state.allProperties = enriched;
          state.filteredProperties = [...enriched];
          applyFiltersAndSearch();
        } catch (err) {
          console.error('Error fetching data:', err);
          if (grid) {
            grid.innerHTML = `
              <div class="col-span-full text-center py-12 text-slate-500">
                <i class="fas fa-exclamation-triangle text-3xl text-amber-400 mb-3"></i>
                <p>Failed to load properties.</p>
                <p class="text-xs text-slate-400 mt-1">${err.message}</p>
              </div>
            `;
          }
        } finally {
          if (skeleton) skeleton.style.display = 'none';
        }
      }

      function applyFiltersAndSearch() {
        const filter = state.currentFilter;
        const query = state.searchQuery.trim().toLowerCase();
        let result = [...state.allProperties];
        if (filter !== 'all') {
          result = result.filter(p => (p.property_type || '').toLowerCase() === filter);
        }
        if (query) {
          result = result.filter(p => {
            const address = (p.address || '').toLowerCase();
            const title = (p.title || '').toLowerCase();
            return address.includes(query) || title.includes(query);
          });
        }
        state.filteredProperties = result;
        renderListings(result);
      }

      // ─── Route handling ─────────────────────────────────────────────
      async function handleRoute() {
        const path = getCurrentPath();
        const discovery = document.getElementById('discoveryView');
        const auth = document.getElementById('authView');
        const dashboard = document.getElementById('dashboardView');
        if (path.startsWith('/broker/')) {
          // Handle broker profile
        } else if (path === '/auth') {
          if (auth) showView(auth);
        } else if (path === '/dashboard') {
          if (state.currentUser) {
            if (dashboard) showView(dashboard);
            await loadMyProperties();
            await loadWallet();
            loadNotifications();
            // Load leads if implemented
          } else {
            navigateTo('/auth', true);
            handleRoute();
          }
        } else {
          if (discovery) showView(discovery);
          applyFiltersAndSearch();
        }
      }

      // ─── Load My Properties ──────────────────────────────────────────
      async function loadMyProperties() {
        if (!state.currentUser) return;
        try {
          const { data, error } = await supabase
            .from('properties')
            .select('*')
            .eq('owner_id', state.currentUser.id)
            .order('created_at', { ascending: false });
          if (error) throw error;
          state.myProperties = data || [];
          renderMyProperties();
        } catch (err) {
          console.error('Error loading my properties:', err);
        }
      }

      // ─── Initialize ──────────────────────────────────────────────────
      async function init() {
        try {
          console.log('🚀 Initializing Property Hub...');
          // Wait for Supabase client
          if (window.supabase) {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('✅ Supabase client created');
          } else {
            console.error('❌ Supabase not loaded');
            return;
          }

          // Check for existing session
          const { data: { user } } = await supabase.auth.getUser();
          if (user) {
            state.currentUser = user;
            document.getElementById('portalBtnLabel').textContent = 'Dashboard';
            await loadWallet();
            await loadNotifications();
          }

          // Event bindings – safe checks
          const searchInput = document.getElementById('searchInput');
          if (searchInput) {
            searchInput.addEventListener('input', (e) => {
              state.searchQuery = e.target.value;
              applyFiltersAndSearch();
            });
          }
          const clearBtn = document.getElementById('clearSearchBtn');
          if (clearBtn) {
            clearBtn.addEventListener('click', () => {
              if (searchInput) {
                searchInput.value = '';
                state.searchQuery = '';
                applyFiltersAndSearch();
                searchInput.focus();
              }
            });
          }

          const filterPills = document.querySelectorAll('.filter-pill');
          filterPills.forEach(pill => {
            pill.addEventListener('click', () => {
              filterPills.forEach(p => p.classList.remove('active'));
              pill.classList.add('active');
              state.currentFilter = pill.dataset.filter;
              applyFiltersAndSearch();
            });
          });

          const brokerPortalBtn = document.getElementById('brokerPortalBtn');
          if (brokerPortalBtn) {
            brokerPortalBtn.addEventListener('click', () => {
              if (state.currentUser) {
                showView(document.getElementById('dashboardView'));
                navigateTo('/dashboard');
                loadMyProperties();
                loadWallet();
                loadNotifications();
              } else {
                navigateToAuth();
              }
            });
          }

          const backToDiscovery = document.getElementById('backToDiscovery');
          if (backToDiscovery) {
            backToDiscovery.addEventListener('click', () => {
              showView(document.getElementById('discoveryView'));
              navigateTo('/');
              applyFiltersAndSearch();
            });
          }

          const backToSearch = document.getElementById('backToSearchBtn');
          if (backToSearch) {
            backToSearch.addEventListener('click', () => {
              showView(document.getElementById('discoveryView'));
              navigateTo('/');
              applyFiltersAndSearch();
            });
          }

          // Auth toggles
          const toggleSignIn = document.getElementById('toggleSignIn');
          const toggleSignUp = document.getElementById('toggleSignUp');
          if (toggleSignIn) toggleSignIn.addEventListener('click', () => setAuthMode(false));
          if (toggleSignUp) toggleSignUp.addEventListener('click', () => setAuthMode(true));

          const authForm = document.getElementById('authForm');
          if (authForm) {
            authForm.addEventListener('submit', handleAuthSubmit);
          }

          const logoutBtn = document.getElementById('logoutBtn');
          if (logoutBtn) logoutBtn.addEventListener('click', handleLogout);

          // Notification bell
          const bell = document.getElementById('notificationBell');
          if (bell) {
            bell.addEventListener('click', async function() {
              if (!state.currentUser) return;
              await supabase
                .from('notifications')
                .update({ read: true })
                .eq('user_id', state.currentUser.id)
                .eq('read', false);
              const badge = document.getElementById('notificationCount');
              if (badge) badge.classList.add('hidden');
              const { data, error } = await supabase
                .from('notifications')
                .select('*')
                .eq('user_id', state.currentUser.id)
                .order('created_at', { ascending: false })
                .limit(10);
              if (error) return;
              if (data.length === 0) { alert('No notifications.'); return; }
              let msg = '📬 Recent Notifications:\n\n';
              data.forEach(n => {
                msg += `📌 ${new Date(n.created_at).toLocaleString()}\n${n.title}: ${n.message}\n\n`;
              });
              alert(msg);
            });
          }

          // Security notification close
          const closeSec = document.getElementById('closeSecurityNotification');
          if (closeSec) {
            closeSec.addEventListener('click', () => {
              const notif = document.getElementById('securityNotification');
              if (notif) notif.style.display = 'none';
            });
          }

          // Show security notification after 3s
          setTimeout(() => {
            const notif = document.getElementById('securityNotification');
            if (notif) notif.style.display = 'block';
          }, 3000);

          // Top-up modal
          const topupBtn = document.getElementById('topupBtn');
          if (topupBtn) {
            topupBtn.addEventListener('click', () => {
              const modal = document.getElementById('topupModal');
              if (modal) {
                document.getElementById('topupAmount').value = '';
                document.getElementById('topupStatus').textContent = '';
                modal.classList.remove('hidden');
              }
            });
          }
          const closeTopup = document.getElementById('closeTopupModal');
          if (closeTopup) {
            closeTopup.addEventListener('click', () => {
              const modal = document.getElementById('topupModal');
              if (modal) modal.classList.add('hidden');
            });
          }
          const topupForm = document.getElementById('topupForm');
          if (topupForm) {
            topupForm.addEventListener('submit', async (e) => {
              e.preventDefault();
              const amount = parseInt(document.getElementById('topupAmount').value);
              if (!amount || amount < 1000) {
                document.getElementById('topupStatus').textContent = 'Enter valid amount (min 1000 UGX)';
                document.getElementById('topupStatus').className = 'mt-3 text-sm text-red-600';
                return;
              }
              document.getElementById('topupStatus').textContent = 'Processing...';
              document.getElementById('topupStatus').className = 'mt-3 text-sm text-indigo-600';
              const success = await depositWalletSimulated(amount);
              if (success) {
                document.getElementById('topupStatus').textContent = `✅ Deposited ${amount.toLocaleString()} UGX!`;
                document.getElementById('topupStatus').className = 'mt-3 text-sm text-emerald-600';
                setTimeout(() => {
                  const modal = document.getElementById('topupModal');
                  if (modal) modal.classList.add('hidden');
                }, 1500);
              } else {
                document.getElementById('topupStatus').textContent = '❌ Deposit failed.';
                document.getElementById('topupStatus').className = 'mt-3 text-sm text-red-600';
              }
            });
          }

          // Dashboard toolbar buttons
          const editProfile = document.getElementById('dashboardEditProfileBtn');
          if (editProfile) {
            editProfile.addEventListener('click', () => {
              const container = document.getElementById('profileFormContainer');
              if (container) {
                if (container.classList.contains('visible')) container.classList.remove('visible');
                else {
                  container.classList.add('visible');
                  document.getElementById('addPropertyContainer').classList.remove('visible');
                  document.getElementById('propertyVerificationContainer').classList.remove('visible');
                }
              }
            });
          }
          const addProp = document.getElementById('dashboardAddPropertyBtn');
          if (addProp) {
            addProp.addEventListener('click', () => {
              const container = document.getElementById('addPropertyContainer');
              if (container) {
                if (container.classList.contains('visible')) container.classList.remove('visible');
                else {
                  container.classList.add('visible');
                  document.getElementById('profileFormContainer').classList.remove('visible');
                  document.getElementById('propertyVerificationContainer').classList.remove('visible');
                }
              }
            });
          }

          // Handle route and fetch initial data
          await handleRoute();
          await fetchAllData();

          // Hide loading overlay
          const overlay = document.getElementById('loadingOverlay');
          if (overlay) overlay.classList.add('hidden');

          console.log('✅ Property Hub ready');
        } catch (err) {
          console.error('Fatal initialization error:', err);
          // Still show discovery view
          showView(document.getElementById('discoveryView'));
          const overlay = document.getElementById('loadingOverlay');
          if (overlay) overlay.classList.add('hidden');
        }
      }

      // ─── Auth handlers ──────────────────────────────────────────────
      async function handleAuthSubmit(e) {
        e.preventDefault();
        const email = document.getElementById('emailInput').value.trim();
        const password = document.getElementById('passwordInput').value;

        if (state.isSignUpMode) {
          const businessName = document.getElementById('bizNameInput').value.trim();
          const accountType = document.getElementById('accTypeSelect').value;
          const phone = document.getElementById('phoneInput').value.trim();
          if (!businessName) { alert('Please enter Business Name.'); return; }
          try {
            const { data, error } = await supabase.auth.signUp({
              email,
              password,
              options: { data: { business_name: businessName, account_type: accountType, phone } }
            });
            if (error) throw error;
            alert('✅ Account created! Please check your email to verify.');
            setAuthMode(false);
            document.getElementById('authForm').reset();
          } catch (err) { alert('❌ Registration failed: ' + err.message); }
        } else {
          try {
            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
            state.currentUser = data.user;
            alert('✅ Signed in successfully!');
            showView(document.getElementById('dashboardView'));
            navigateTo('/dashboard');
            document.getElementById('portalBtnLabel').textContent = 'Dashboard';
            await loadProfileSettings();
            await loadMyProperties();
            await loadWallet();
            await fetchAllData();
            loadNotifications();
          } catch (err) { alert('❌ Sign in failed: ' + err.message); }
        }
      }

      async function handleLogout() {
        await supabase.auth.signOut();
        state.currentUser = null;
        document.getElementById('portalBtnLabel').textContent = 'Broker Portal';
        showView(document.getElementById('discoveryView'));
        navigateTo('/');
        applyFiltersAndSearch();
      }

      // ─── Load profile settings ──────────────────────────────────────
      async function loadProfileSettings() {
        if (!state.currentUser) return;
        try {
          const { data, error } = await supabase
            .from('profiles')
            .select('business_name, phone, is_admin')
            .eq('id', state.currentUser.id)
            .single();
          if (error) throw error;
          document.getElementById('settingsBusinessName').value = data.business_name || '';
          document.getElementById('settingsPhone').value = data.phone || '';
          state.isAdmin = data.is_admin || false;
        } catch (err) { console.error('Error loading profile:', err); }
      }

      // ─── Start ──────────────────────────────────────────────────────
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
