      function isTrustedBroker(broker) {
        if (!broker) return false;
        return (broker.average_rating >= 4 && broker.review_count >= 10 && broker.lead_score >= 20 && (broker.report_count || 0) < 3);
      }
      function calculateRankScore(property, broker, reportCount = 0) {
        let score = 0;
        if (property.verification_status === 'approved') score += 100;
        else if (property.verification_status === 'pending') score += 30;
        if (broker) {
          score += (broker.average_rating || 0) * 10;
          score += Math.min(broker.review_count || 0, 50) * 0.5;
          if (isTrustedBroker(broker)) score += 20;
          score += (broker.lead_score || 0) / 2;
          score -= (reportCount || 0) * 5;
        }
        return Math.round(score);
      }

      function createPropertyCard(property, broker, showBrokerLink = true, showEdit = false) {
        const article = document.createElement('article');
        article.className = 'property-card bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200/70 flex flex-col';
        const imageUrl = getImageUrl(property);
        const rating = broker?.average_rating || 0;
        const reviewCount = broker?.review_count || 0;
        const leadScore = broker?.lead_score || 0;
        const isOwner = state.currentUser && broker && state.currentUser.id === broker.id;
        const verificationStatus = property.verification_status || 'pending';
        const isVerified = verificationStatus === 'approved';
        const isTrusted = broker ? isTrustedBroker(broker) : false;
        const reportCount = broker?.report_count || 0;
        const rankScore = property.rankScore || calculateRankScore(property, broker, reportCount);

        let badgeHtml = '';
        if (isVerified) badgeHtml = `<span class="badge-verified"><i class="fas fa-check-circle"></i> Verified</span>`;
        else if (verificationStatus === 'pending') badgeHtml = `<span class="badge-pending"><i class="fas fa-clock"></i> Pending</span>`;
        else if (verificationStatus === 'rejected') badgeHtml = `<span class="badge-rejected"><i class="fas fa-times-circle"></i> Rejected</span>`;

        let trustedHtml = '';
        if (isTrusted) trustedHtml = `<span class="badge-trusted"><i class="fas fa-star"></i> Trusted</span>`;

        let actionsHtml = '';
        if (showEdit) actionsHtml += `<button class="edit-btn text-xs text-indigo-600 hover:text-indigo-800 font-medium" data-id="${property.id}"><i class="fas fa-edit mr-1"></i>Edit</button>`;
        let boostHtml = '';
        if (showEdit && state.currentUser) boostHtml = `<button class="boost-btn text-xs text-emerald-600 hover:text-emerald-800 font-medium ml-2" data-broker-id="${state.currentUser.id}"><i class="fas fa-rocket mr-1"></i>Boost</button>`;
        let rateHtml = '';
        if (!showEdit && state.currentUser && broker && !isOwner) rateHtml = `<button class="rate-btn text-xs text-yellow-600 hover:text-yellow-800 font-medium" data-broker-id="${broker.id}"><i class="fas fa-star mr-1"></i>Rate</button>`;

        let pauseHtml = '';
        if (showEdit) {
          const pauseText = property.is_paused ? 'Resume' : 'Pause';
          const pauseIcon = property.is_paused ? 'fa-play' : 'fa-pause';
          pauseHtml = `<button class="pause-btn text-xs text-blue-600 hover:text-blue-800 font-medium ml-2" data-property-id="${property.id}" data-paused="${property.is_paused}"><i class="fas ${pauseIcon} mr-1"></i>${pauseText}</button>`;
        }

        let connectHtml = '';
        if (!showEdit) {
          connectHtml = `<button class="connect-btn bg-indigo-600 hover:bg-indigo-700 text-white text-[10px] font-semibold px-3 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm hover:shadow transition" data-property-id="${property.id}"><i class="fas fa-handshake"></i> Connect</button>`;
        }

        article.innerHTML = `
          <div class="relative aspect-[4/3] bg-slate-200 overflow-hidden">
            <img src="${imageUrl}" alt="${property.title || 'Property'}" class="w-full h-full object-cover" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1560518883-ce09059eeffa?w=600&h=400&fit=crop&crop=center'"/>
            <span class="absolute bottom-3 right-3 bg-black/60 text-white text-xs px-3 py-1 rounded-full">${property.property_type || 'Property'}</span>
            ${!showEdit && isVerified ? `<span class="absolute top-3 right-3 bg-emerald-600 text-white text-[8px] font-bold px-2 py-1 rounded-full"><i class="fas fa-check-circle mr-1"></i>VERIFIED</span>` : ''}
          </div>
          <div class="p-4 flex flex-col flex-1">
            <div class="flex items-center justify-between flex-wrap gap-1">
              <h3 class="font-semibold text-slate-800 text-base line-clamp-1">${property.title || 'Untitled'}</h3>
              <div class="flex items-center gap-1">${!showEdit ? badgeHtml : ''} ${!showEdit && isTrusted ? trustedHtml : ''}</div>
            </div>
            <p class="text-indigo-700 font-bold text-sm mt-0.5">${formatPrice(property.price_amount)}</p>
            <p class="text-slate-500 text-xs flex items-center gap-1 mt-0.5"><i class="fas fa-map-pin text-slate-400 text-[10px]"></i>${property.address || 'Location not specified'}</p>
            <div class="mt-2 flex items-center gap-2 text-xs">
              <span class="stars text-xs">${renderStars(rating)}</span>
              <span class="text-slate-500">(${reviewCount})</span>
              <span class="badge-lead">⚡ ${leadScore}</span>
            </div>
            ${!showEdit ? `<div class="mt-1 flex items-center gap-2 text-xs text-slate-400"><span>Rank Score: ${rankScore}</span>${reportCount > 0 ? `<span class="text-red-500"><i class="fas fa-exclamation-triangle"></i> ${reportCount}</span>` : ''}</div>` : ''}
            <div class="mt-3 flex items-center justify-between gap-2 border-t border-slate-100 pt-3 flex-wrap">
              ${showBrokerLink ? `<button class="broker-name-link text-xs font-medium text-indigo-600 hover:text-indigo-800 hover:underline flex items-center gap-1 cursor-pointer" data-broker-id="${broker?.id || ''}"><i class="fas fa-user-circle text-slate-400"></i> ${broker?.business_name || 'Unknown Broker'}${isTrusted ? ` <span class="text-amber-500"><i class="fas fa-star"></i></span>` : ''}</button>` : `<span class="text-xs text-slate-500 flex items-center gap-1"><i class="fas fa-user-circle text-slate-400"></i> ${broker?.business_name || 'Broker'}</span>`}
              <div class="flex gap-2">${actionsHtml}${boostHtml}${pauseHtml}${rateHtml}${connectHtml}</div>
            </div>
          </div>
        `;

        article.querySelector('.edit-btn')?.addEventListener('click', e => { e.stopPropagation(); openEditModal(property.id); });
        article.querySelector('.boost-btn')?.addEventListener('click', async e => { e.stopPropagation(); try { await supabase.rpc('increment_lead_score', { broker_id: e.currentTarget.dataset.brokerId, amount: 5 }); alert('Boosted!'); } catch (err) { alert('Error: ' + err.message); } });
        article.querySelector('.rate-btn')?.addEventListener('click', e => { e.stopPropagation(); openReviewModal(broker.id); });
        article.querySelector('.broker-name-link')?.addEventListener('click', e => { e.stopPropagation(); navigateToBroker(broker.id); });
        article.querySelector('.connect-btn')?.addEventListener('click', e => { e.stopPropagation(); openQuizModal(property.id); });
        article.querySelector('.pause-btn')?.addEventListener('click', e => { e.stopPropagation(); togglePropertyPause(property.id, property.is_paused); });
        return article;
      }

      async function togglePropertyPause(propertyId, currentPaused) {
        try {
          const newPaused = !currentPaused;
          const { error } = await supabase.from('properties').update({ is_paused: newPaused }).eq('id', propertyId);
          if (error) throw error;
          alert(newPaused ? 'Property paused.' : 'Property resumed.');
          await loadMyProperties();
          await fetchAllData();
        } catch (err) { alert('Error: ' + err.message); }
      }

      function renderListings(properties) {
        const grid = $('#listingsGrid');
        if (!grid) return;
        grid.innerHTML = '';
        if (!properties || properties.length === 0) {
          $('#emptyState')?.classList.remove('hidden');
          $('#propertyCount').textContent = '0 listings';
          return;
        }
        $('#emptyState')?.classList.add('hidden');
        $('#propertyCount').textContent = `${properties.length} listing${properties.length > 1 ? 's' : ''}`;
        properties.forEach(prop => {
          const broker = prop.broker || state.profilesMap[prop.owner_id] || null;
          grid.appendChild(createPropertyCard(prop, broker, true, false));
        });
      }

      function renderMyProperties() {
        const list = $('#myPropertiesList');
        if (!list) return;
        list.innerHTML = '';
        if (state.myProperties.length === 0) {
          $('#myPropertiesEmpty')?.classList.remove('hidden');
          return;
        }
        $('#myPropertiesEmpty')?.classList.add('hidden');
        state.myProperties.forEach(prop => {
          const card = createPropertyCard(prop, state.currentUser, false, true);
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'mt-2 text-xs text-red-500 hover:text-red-700 font-medium';
          deleteBtn.innerHTML = '<i class="fas fa-trash mr-1"></i> Remove';
          deleteBtn.addEventListener('click', async () => { if (confirm('Delete this property?')) { await supabase.from('properties').delete().eq('id', prop.id); state.myProperties = state.myProperties.filter(p => p.id !== prop.id); renderMyProperties(); await fetchAllData(); } });
          card.querySelector('.p-4').appendChild(deleteBtn);
          list.appendChild(card);
        });
      }

      async function fetchAllData() {
        const grid = $('#listingsGrid');
        const skeleton = $('#loadingSkeleton');
        const empty = $('#emptyState');
        if (skeleton) skeleton.style.display = 'grid';
        if (grid) grid.innerHTML = '';
        if (empty) empty.classList.add('hidden');

        try {
          let query = supabase.from('properties').select('*');
          let { data: properties, error } = await query.eq('is_paused', false).order('created_at', { ascending: false });
          if (error) {
            console.warn('is_paused column missing, fetching all properties');
            const { data: allProps, error: allErr } = await supabase.from('properties').select('*').order('created_at', { ascending: false });
            if (allErr) throw allErr;
            properties = allProps;
            state.hasPauseFeature = false;
          } else {
            state.hasPauseFeature = true;
          }
          state.allProperties = properties || [];
          state.filteredProperties = [...state.allProperties];

          const ownerIds = [...new Set(state.allProperties.map(p => p.owner_id).filter(id => id))];
          if (ownerIds.length) {
            const { data: profiles } = await supabase.from('profiles').select('*').in('id', ownerIds);
            state.profilesMap = profiles ? profiles.reduce((acc, p) => (acc[p.id] = p, acc), {}) : {};
          }
          applyFiltersAndSearch();
        } catch (err) { console.error('Fetch error:', err); } finally { if (skeleton) skeleton.style.display = 'none'; }
      }

      async function loadMyProperties() {
        if (!state.currentUser) return;
        try {
          const { data, error } = await supabase.from('properties').select('*').eq('owner_id', state.currentUser.id).order('created_at', { ascending: false });
          if (error) throw error;
          state.myProperties = data || [];
          renderMyProperties();
        } catch (err) { console.error('Load my properties error:', err); }
      }

      function applyFiltersAndSearch() {
        const filter = state.currentFilter;
        const query = state.searchQuery.trim().toLowerCase();
        let result = [...state.allProperties];
        if (filter !== 'all') result = result.filter(p => (p.property_type || '').toLowerCase() === filter);
        if (query) {
          result = result.filter(p => {
            const address = (p.address || '').toLowerCase();
            const title = (p.title || '').toLowerCase();
            return address.includes(query) || title.includes(query);
          });
        }
        state.filteredProperties = result;
        renderListings(result);
      }

      async function openQuizModal(propertyId) {
        $('#quizPropertyId').value = propertyId;
        $('#quizStep1').classList.remove('hidden');
        $('#quizStep2').classList.add('hidden');
        $('#quizForm').reset();
        $('#quizModal').classList.remove('hidden');
      }

      const quizFormEl = $('#quizForm');
      if (quizFormEl) {
        quizFormEl.addEventListener('submit', async function(e) {
          e.preventDefault();
          const propertyId = $('#quizPropertyId').value;
          const name = $('#quizName').value.trim();
          const email = $('#quizEmail').value.trim();
          const whatsapp = $('#quizWhatsapp').value.trim();
          const q1 = document.querySelector('input[name="q1"]:checked');
          const q2 = document.querySelector('input[name="q2"]:checked');
          if (!q1 || !q2) { alert('Answer both quiz questions.'); return; }
          const totalScore = parseInt(q1.value) + parseInt(q2.value);
          const leadType = totalScore >= 7 ? 'hot' : totalScore >= 4 ? 'warm' : 'cold';
          const answers = { q1: parseInt(q1.value), q2: parseInt(q2.value) };

          try {
            const { data: lead, error } = await supabase.from('lead_requests').insert({
              property_id: propertyId,
              visitor_name: name,
              visitor_email: email,
              visitor_whatsapp: whatsapp,
              quiz_answers: answers,
              total_score: totalScore,
              lead_type: leadType,
              status: 'pending'
            }).select().single();
            if (error) throw error;

            // Send email to broker
            const { data: propData } = await supabase.from('properties').select('owner_id, title, address').eq('id', propertyId).single();
            if (propData) {
              const { data: brokerData } = await supabase.from('profiles').select('email, business_name').eq('id', propData.owner_id).single();
              if (brokerData?.email) {
                const message = `New lead request!\nProperty: ${propData.title}\nAddress: ${propData.address}\nVisitor: ${name}\nEmail: ${email}\nWhatsApp: ${whatsapp}\nLead type: ${leadType}\nScore: ${totalScore}/8`;
                await sendNotificationEmail(brokerData.email, brokerData.business_name || 'Broker', '🔔 New Lead Request', message);
              }
            }

            $('#quizModal').classList.add('hidden');
            $('#waitingModal').classList.remove('hidden');
            $('#waitingStatus').textContent = 'Request sent. Waiting for broker...';
            subscribeToLeadRequest(lead.id);
          } catch (err) {
            console.error(err);
            alert('Error: ' + err.message);
          }
        });
      }

      function subscribeToLeadRequest(requestId) {
        const interval = setInterval(async () => {
          const { data } = await supabase.from('lead_requests').select('status').eq('id', requestId).single();
          if (data?.status === 'approved') { clearInterval(interval); $('#waitingModal').classList.add('hidden'); alert('✅ Lead approved!'); }
          else if (data?.status === 'rejected') { clearInterval(interval); $('#waitingModal').classList.add('hidden'); alert('❌ Lead rejected.'); }
        }, 3000);
      }

      async function loadLeads() { /* unchanged */ }
      async function loadPropertyVerificationList() { /* unchanged */ }
      async function openPropertyVerificationModal(propertyId) { /* unchanged */ }
      async function loadBrokerProfile(brokerId) { /* unchanged */ }
      function goToDiscovery() { showView($('#discoveryView')); state.currentBrokerId = null; navigateTo('/'); applyFiltersAndSearch(); }
      function navigateToAuth() { showView($('#authView')); navigateTo('/auth'); setAuthMode(false); $('#authForm').reset(); }
      async function handleRoute() { /* unchanged */ }

      async function init() {
        console.log('🚀 Initializing...');
        if (window.supabase) supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        else return;

        try { const { data: { user } } = await supabase.auth.getUser(); if (user) { state.currentUser = user; $('#portalBtnLabel').textContent = 'Dashboard'; await loadWallet(); } } catch (e) {}

        $('#searchInput')?.addEventListener('input', e => { state.searchQuery = e.target.value; applyFiltersAndSearch(); });
        $('#clearSearchBtn')?.addEventListener('click', () => { $('#searchInput').value = ''; state.searchQuery = ''; applyFiltersAndSearch(); });
        $$('.filter-pill').forEach(pill => pill.addEventListener('click', () => {
          $$('.filter-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          state.currentFilter = pill.dataset.filter;
          applyFiltersAndSearch();
        }));
        $('#brokerPortalBtn')?.addEventListener('click', () => {
          if (state.currentUser) { showView($('#dashboardView')); navigateTo('/dashboard'); loadMyProperties(); loadWallet(); loadLeads(); }
          else navigateToAuth();
        });
        $('#backToDiscovery')?.addEventListener('click', goToDiscovery);
        $('#backToSearchBtn')?.addEventListener('click', goToDiscovery);
        $('#toggleSignIn')?.addEventListener('click', () => setAuthMode(false));
        $('#toggleSignUp')?.addEventListener('click', () => setAuthMode(true));
        $('#logoutBtn')?.addEventListener('click', async () => { await supabase.auth.signOut(); state.currentUser = null; $('#portalBtnLabel').textContent = 'Broker Portal'; goToDiscovery(); });

        setTimeout(() => { $('#securityNotification').style.display = 'block'; }, 3000);
        $('#closeSecurityNotification')?.addEventListener('click', () => { $('#securityNotification').style.display = 'none'; });

        await handleRoute();
        await fetchAllData();
        $('#loadingOverlay').classList.add('hidden');
        console.log('✅ Ready');
      }

      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
      else init();
    })();
  </script>
</body>
</html>
