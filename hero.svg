<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#4f46e5"/>
      <stop offset="75%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="windowGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1400" height="800" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="1050" cy="420" r="180" fill="url(#sunGlow)"/>
  <circle cx="1050" cy="420" r="70" fill="#fef3c7"/>

  <!-- Distant hills -->
  <path d="M0,560 Q200,510 380,540 T720,530 T1050,555 T1400,530 L1400,800 L0,800 Z" fill="#312e81" opacity="0.4"/>
  <path d="M0,620 Q250,580 460,600 T860,590 T1230,610 T1400,600 L1400,800 L0,800 Z" fill="#3730a3" opacity="0.3"/>

  <!-- Buildings back row -->
