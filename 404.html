<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Property Hub Uganda</title>
  <script>
    // GitHub Pages SPA 404 redirect hack
    // Based on https://github.com/rafgraph/spa-github-pages
    (function() {
      var segmentCount = 0; // 0 for custom domain, 1 for username.github.io/repo
      var location = window.location;
      var repo = '/';
      var l = location.pathname.split('/').slice(1 + segmentCount);
      var path = '/' + l.slice(0).join('/');
      var search = location.search;
      var hash = location.hash;
      location.replace(
        location.origin + repo + '?p=' + encodeURIComponent(path + search) + hash
      );
    })();
  </script>
</head>
<body>
  <p>Redirecting to Property Hub…</p>
</body>
</html>
