<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Property Hub Uganda</title>
  <script>
    // GitHub Pages SPA 404 redirect hack
    // Preserves the path so your router can handle it
    (function() {
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      var redirect = '/?redirect=' + encodeURIComponent(path + search + hash);
      window.location.replace(redirect);
    })();
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
